name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Compile sources
        run: >
          uv run python -m py_compile
          noise_evidence\config.py
          noise_evidence\detect.py
          noise_evidence\export.py
          noise_evidence\gui\worker.py
          noise_evidence\gui\waveform.py
          noise_evidence\gui\style.py
          noise_evidence\gui\main_window.py
          scripts\make_icon.py
          tests\test_core_workflow.py

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Format Rust workspace
        run: cargo fmt --all --manifest-path next\Cargo.toml --check

      - name: Check Rust workspace
        run: cargo check --manifest-path next\Cargo.toml

      - name: Test Rust workspace
        run: cargo test --manifest-path next\Cargo.toml

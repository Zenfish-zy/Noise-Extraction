[package]
name = "noise-evidence-next"
version = "0.1.0"
description = "Next-generation desktop shell for Noise Evidence"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noise-core = { path = "../../crates/noise-core" }
noise-io = { path = "../../crates/noise-io" }
noise-types = { path = "../../crates/noise-types" }

[lib]
name = "noise_evidence_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
